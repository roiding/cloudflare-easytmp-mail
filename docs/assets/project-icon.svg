      <stop offset="0%" stop-color="#F6821F" />
      <stop offset="100%" stop-color="#E25404" />
    </linearGradient>
    <linearGradient id="mailGrad" x1="28" y1="40" x2="100" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2F5F8" />
    </linearGradient>
    <filter id="shadow" x="12" y="14" width="104" height="104" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#A73800" flood-opacity="0.35" />
